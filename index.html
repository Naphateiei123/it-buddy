<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naphat Discord Hub</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

    body {
        margin: 0;
        padding: 0;
        background: #0d0f18;
        font-family: 'Poppins', sans-serif;
        color: white;
        overflow-x: hidden;
    }

    /* พื้นหลัง Particle */
    #backgroundCanvas {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
    }

    .container {
        max-width: 700px;
        margin: 80px auto;
        padding: 40px;
        text-align: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 25px;
        box-shadow: 0 0 30px rgba(120, 90, 255, 0.5);
        backdrop-filter: blur(15px);
        animation: fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-big {
        width: 150px;
        filter: drop-shadow(0 0 25px rgba(88, 101, 242, 1));
        animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.08); }
        100% { transform: scale(1); }
    }

    .title {
        margin-top: 15px;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 0 0 18px rgba(255,255,255,0.5);
    }

    /* ปุ่ม Neon 3D */
    .btn {
        width: 100%;
        padding: 18px;
        border-radius: 15px;
        border: none;
        margin-top: 18px;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        background: rgba(255,255,255,0.08);
        color: white;
        transition: 0.25s;
    }

    .btn img { height: 28px; }

    .btn:hover {
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 0 25px rgba(255,255,255,0.35);
    }

    .btn span {
        position: relative;
        z-index: 5;
    }

    .btn::before {
        content: "";
        position: absolute;
        width: 130%;
        height: 300%;
        top: -100%;
        left: -15%;
        background: linear-gradient(120deg, #8a63ff, #00ffe7, #ff00f7);
        animation: rotateGlow 4s linear infinite;
        opacity: 0.35;
    }

    @keyframes rotateGlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* ผู้จัดทำ */
    .credit-box {
        margin-top: 35px;
        padding: 25px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255,255,255,0.15);
        box-shadow: inset 0 0 20px rgba(255,255,255,0.1);
        animation: fadeIn 1.4s ease;
    }

    .credit-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 15px;
        text-shadow: 0 0 15px rgba(255,255,255,0.4);
    }

    .credit-name {
        padding: 10px;
        margin: 7px 0;
        border-radius: 14px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.25);
        font-weight: 600;
        font-size: 17px;
        transition: 0.2s;
    }

    .credit-name:hover {
        transform: scale(1.05);
        background: rgba(255,255,255,0.12);
        box-shadow: 0 0 20px rgba(120, 90, 255, 0.7);
    }

    footer {
        margin-top: 25px;
        opacity: 0.6;
        font-size: 14px;
    }
</style>
</head>

<body>

<canvas id="backgroundCanvas"></canvas>

<div class="container">

    <img src="https://images-eds-ssl.xboxlive.com/image?url=4rt9.lXDC4H_93laV1_eHHFT949fUipzkiFOBH3fAiZZUCdYojwUyX2aTonS1aIwMrx6NUIsHfUHSLzjGJFxxsG72wAo9EWJR4yQWyJJaDaK1XdUso6cUMpI9hAdPUU_FNs11cY1X284vsHrnWtRw7oqRpN1m9YAg21d_aNKnIo-&format=source" class="logo-big">
    <div class="title">It Buddy Discord </div>

    <a href="https://play.google.com/store/apps/details?id=com.discord" target="_blank">
        <button class="btn btn-play">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
            <span>ดาวน์โหลด Discord (Play Store)</span>
        </button>
    </a>

    <a href="https://discord.gg/sJKXQ7z8y4" target="_blank">
        <button class="btn btn-discord">
            <img src="https://images-eds-ssl.xboxlive.com/image?url=4rt9.lXDC4H_93laV1_eHHFT949fUipzkiFOBH3fAiZZUCdYojwUyX2aTonS1aIwMrx6NUIsHfUHSLzjGJFxxsG72wAo9EWJR4yQWyJJaDaK1XdUso6cUMpI9hAdPUU_FNs11cY1X284vsHrnWtRw7oqRpN1m9YAg21d_aNKnIo-&format=source">
            <span>เข้าดิสคอร์ดของเรา</span>
        </button>
    </a>

    <a href="https://www.facebook.com/share/17n4NnXbms/" target="_blank">
        <button class="btn btn-facebook">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg">
            <span>เทคโนโลยีสารสนเทศ (Fanpage)</span>
        </button>
    </a>

    <div class="credit-box">
        <div class="credit-title">ผู้จัดทำ</div>
        <div class="credit-name">・ นายณภัทร ศรีบุญเรือง</div>
        <div class="credit-name">・ นายพีรภัทร ยะอนันต์</div>
    </div>

    <footer>© 2025 Naphat | Discord Community Hub</footer>
</div>

<!-- JavaScript ทำ Particle Background -->
<script>
    const canvas = document.getElementById("backgroundCanvas");
    const ctx = canvas.getContext("2d");

    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    const particles = [];

    for (let i = 0; i < 70; i++) {
        particles.push({
            x: Math.random()*w,
            y: Math.random()*h,
            r: Math.random()*3 + 1,
            vx: (Math.random() - 0.5)*0.8,
            vy: (Math.random() - 0.5)*0.8
        });
    }

    function draw() {
        ctx.clearRect(0,0,w,h);

        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = "rgba(140,120,255,0.8)";
            ctx.fill();

            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > w) p.vx *= -1;
            if (p.y < 0 || p.y > h) p.vy *= -1;
        });

        requestAnimationFrame(draw);
    }

    draw();

    window.addEventListener("resize", () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    });
</script>

</body>
</html>
